server:
  port: 8888

spring:
  application:
    name: food-pool-management
  
  data:
    mongodb:
      uri: ${MONGODB_URI}
      database: ${MONGODB_DATABASE:food_management}
  
  security:
    oauth2:
      client:
        registration:
          zoho:
            client-id: ${ZOHO_CLIENT_ID}
            client-secret: ${ZOHO_CLIENT_SECRET}
            scope: AaaServer.profile.READ,email
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-name: Zoho
        provider:
          zoho:
            authorization-uri: https://accounts.zoho.in/oauth/v2/auth
            token-uri: https://accounts.zoho.in/oauth/v2/token
            user-info-uri: https://accounts.zoho.in/oauth/user/info
            user-name-attribute: Email
  
  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html

# App configuration (all sensitive data via environment variables)
app:
  admin-emails: ${ADMIN_EMAILS:admin@encipherhealth.com}
  base-url: ${APP_BASE_URL:https://food.management.encipherhealth.com}
  cliq:
    webhook-url: ${CLIQ_WEBHOOK_URL}
    bot-message-url: ${CLIQ_BOT_MESSAGE_URL}
  azure-openai:
    endpoint: ${AZURE_OPENAI_ENDPOINT}
    api-key: ${AZURE_OPENAI_KEY}
    deployment-name: ${AZURE_OPENAI_DEPLOYMENT:gpt-4o}
    api-version: ${AZURE_OPENAI_API_VERSION:2025-04-01-preview}

logging:
  level:
    org.springframework.security: ${LOG_LEVEL_SECURITY:INFO}
    com.encipher: ${LOG_LEVEL_APP:INFO}
