<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Users | Food Pool</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Poppins',sans-serif;background:#0f0f1a;min-height:100vh;color:#fff}
        .header{background:linear-gradient(135deg,#1a1a2e,#16213e);padding:15px 20px;display:flex;align-items:center;gap:15px}
        .back{color:#fff;text-decoration:none;font-size:1.5rem}
        .title{font-size:1.1rem;font-weight:600}
        .container{max-width:800px;margin:0 auto;padding:20px}
        h2{margin:25px 0 15px;font-size:1.1rem;display:flex;align-items:center;gap:10px}
        .count{color:rgba(255,255,255,0.5);font-size:0.85rem;font-weight:400}
        
        .nav-links{display:flex;gap:10px;margin:20px 0;flex-wrap:wrap}
        .nav-link{color:rgba(255,255,255,0.6);text-decoration:none;padding:8px 16px;border-radius:8px;background:rgba(255,255,255,0.05);font-size:0.85rem}
        .nav-link:hover,.nav-link.active{background:rgba(233,69,96,0.2);color:#e94560}
        
        .card{background:rgba(255,255,255,0.05);border-radius:16px;padding:20px;margin:15px 0}
        .card-title{font-size:0.9rem;color:rgba(255,255,255,0.6);margin-bottom:15px}
        
        .form-row{display:grid;grid-template-columns:1fr 2fr 2fr auto;gap:10px;margin-bottom:10px}
        .form-input{padding:10px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:8px;color:#fff;font-family:inherit}
        .form-input::placeholder{color:rgba(255,255,255,0.3)}
        .btn-add{padding:10px 20px;background:#00ff88;color:#000;border:none;border-radius:8px;font-weight:600;cursor:pointer}
        
        .upload-box{border:2px dashed rgba(255,255,255,0.2);border-radius:12px;padding:25px;text-align:center;margin:15px 0}
        .upload-box input{display:none}
        .upload-btn{display:inline-block;padding:10px 20px;background:rgba(255,255,255,0.1);border-radius:8px;cursor:pointer;font-weight:500}
        .upload-btn:hover{background:rgba(255,255,255,0.2)}
        
        .user-list{background:rgba(255,255,255,0.05);border-radius:12px;overflow:hidden}
        .user-item{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;border-bottom:1px solid rgba(255,255,255,0.05)}
        .user-item:last-child{border:none}
        .user-info{flex:1}
        .user-name{font-weight:500;display:flex;align-items:center;gap:8px}
        .user-id{font-size:0.8rem;color:rgba(255,255,255,0.5)}
        .user-email{font-size:0.75rem;color:rgba(255,255,255,0.4)}
        .badge{padding:3px 8px;border-radius:10px;font-size:0.65rem;font-weight:600}
        .badge.admin{background:rgba(233,69,96,0.2);color:#e94560}
        .user-actions{display:flex;gap:8px}
        .btn-action{padding:6px 12px;border:1px solid rgba(255,255,255,0.2);border-radius:6px;background:transparent;color:#fff;font-size:0.75rem;cursor:pointer}
        .btn-action:hover{border-color:#e94560;color:#e94560}
        .btn-action.danger{border-color:#ff5252;color:#ff5252}
        .btn-action.danger:hover{background:rgba(255,82,82,0.2)}
        
        .message{padding:12px;border-radius:8px;margin:15px 0;text-align:center}
        .message.success{background:rgba(0,255,136,0.15);color:#00ff88}
        .message.error{background:rgba(255,82,82,0.15);color:#ff5252}
        .hidden{display:none}
        
        .admins-list{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}
        .admin-chip{background:rgba(233,69,96,0.2);padding:8px 15px;border-radius:20px;font-size:0.85rem;display:flex;align-items:center;gap:8px}
        .admin-chip .remove{cursor:pointer;opacity:0.6}
        .admin-chip .remove:hover{opacity:1}
        
        @media(max-width:600px){
            .form-row{grid-template-columns:1fr;gap:8px}
            .user-actions{flex-direction:column}
        }
    </style>
</head>
<body>
<div class="header">
    <a href="/admin" class="back">←</a>
    <span class="title">Manage Users</span>
</div>

<div class="container">
    <div class="nav-links">
        <a href="/admin" class="nav-link">Dashboard</a>
        <a href="/admin/menu" class="nav-link">Menu Settings</a>
        <a href="/admin/employees" class="nav-link active">Manage Users</a>
    </div>
    
    <div id="message" class="message hidden"></div>
    
    <!-- Admins -->
    <h2>👑 Admins <span class="count" th:text="'(' + ${#lists.size(admins)} + ')'"></span></h2>
    <div class="card">
        <div class="admins-list">
            <div th:each="admin : ${admins}" class="admin-chip">
                <span th:text="${admin.name}">Admin Name</span>
                <span class="remove" th:onclick="'removeAdmin(\'' + ${admin.employeeId} + '\')'" title="Remove admin">✕</span>
            </div>
            <div th:if="${#lists.isEmpty(admins)}" style="color:rgba(255,255,255,0.5)">No admins configured</div>
        </div>
    </div>
    
    <!-- Add Employee -->
    <h2>➕ Add Employee</h2>
    <div class="card">
        <div class="form-row">
            <input type="text" class="form-input" id="newEmpId" placeholder="Employee ID">
            <input type="text" class="form-input" id="newEmpName" placeholder="Full Name">
            <input type="email" class="form-input" id="newEmpEmail" placeholder="Email (optional)">
            <button class="btn-add" onclick="addEmployee()">Add</button>
        </div>
    </div>
    
    <!-- Upload -->
    <h2>📁 Bulk Upload</h2>
    <div class="upload-box">
        <p style="margin-bottom:10px;color:rgba(255,255,255,0.6);font-size:0.85rem">Upload Excel file with employee data</p>
        <input type="file" id="fileInput" accept=".xlsx,.xls" onchange="uploadFile()">
        <label for="fileInput" class="upload-btn">Select Excel File</label>
    </div>
    
    <!-- Employee List -->
    <h2>👥 All Employees <span class="count" th:text="'(' + ${#lists.size(employees)} + ')'"></span></h2>
    <div class="user-list">
        <div th:each="emp : ${employees}" class="user-item">
            <div class="user-info">
                <div class="user-name">
                    <span th:text="${emp.name}">Name</span>
                    <span th:if="${emp.admin}" class="badge admin">ADMIN</span>
                </div>
                <div class="user-id" th:text="${emp.employeeId}">ID</div>
                <div th:if="${emp.email}" class="user-email" th:text="${emp.email}">email</div>
            </div>
            <div class="user-actions">
                <button class="btn-action" 
                        th:text="${emp.admin} ? 'Remove Admin' : 'Make Admin'"
                        th:onclick="'toggleAdmin(\'' + ${emp.employeeId} + '\', ' + ${!emp.admin} + ')'">
                </button>
                <button class="btn-action danger" 
                        th:onclick="'deleteEmployee(\'' + ${emp.employeeId} + '\', \'' + ${emp.name} + '\')'">
                    Remove
                </button>
            </div>
        </div>
    </div>
</div>

<script>
function showMessage(text, isSuccess) {
    const msg = document.getElementById('message');
    msg.textContent = text;
    msg.className = 'message ' + (isSuccess ? 'success' : 'error');
    setTimeout(() => msg.classList.add('hidden'), 3000);
}

async function addEmployee() {
    const employeeId = document.getElementById('newEmpId').value.trim();
    const name = document.getElementById('newEmpName').value.trim();
    const email = document.getElementById('newEmpEmail').value.trim();
    
    if (!employeeId || !name) {
        showMessage('Employee ID and Name are required', false);
        return;
    }
    
    try {
        const res = await fetch('/admin/employees/add', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({employeeId, name, email: email || null, isAdmin: false})
        });
        const data = await res.json();
        if (data.success) {
            showMessage(data.message, true);
            setTimeout(() => location.reload(), 1000);
        } else {
            showMessage(data.error, false);
        }
    } catch (e) {
        showMessage('Error: ' + e.message, false);
    }
}

async function uploadFile() {
    const input = document.getElementById('fileInput');
    if (!input.files[0]) return;
    
    const formData = new FormData();
    formData.append('file', input.files[0]);
    
    try {
        const res = await fetch('/admin/employees/upload', {method: 'POST', body: formData});
        const data = await res.json();
        showMessage(data.message || data.error, data.success);
        if (data.success) setTimeout(() => location.reload(), 1500);
    } catch (e) {
        showMessage('Error: ' + e.message, false);
    }
}

async function toggleAdmin(employeeId, isAdmin) {
    try {
        await fetch('/admin/employees/' + employeeId + '/admin', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({isAdmin})
        });
        location.reload();
    } catch (e) {
        showMessage('Error: ' + e.message, false);
    }
}

async function removeAdmin(employeeId) {
    if (!confirm('Remove admin privileges?')) return;
    await toggleAdmin(employeeId, false);
}

async function deleteEmployee(employeeId, name) {
    if (!confirm('Remove ' + name + ' from the system?')) return;
    try {
        await fetch('/admin/employees/' + employeeId, {method: 'DELETE'});
        location.reload();
    } catch (e) {
        showMessage('Error: ' + e.message, false);
    }
}
</script>
</body>
</html>
