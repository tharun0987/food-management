<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home | Encipher Food Pool</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Poppins',sans-serif;background:#0f0f1a;min-height:100vh;color:#fff}
        .header{background:linear-gradient(135deg,#1a1a2e,#16213e);padding:20px;display:flex;justify-content:space-between;align-items:center}
        .logo{display:flex;align-items:center;gap:10px}
        .logo-icon{width:40px;height:40px;background:linear-gradient(135deg,#e94560,#ff6b6b);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px}
        .logo-text{font-weight:600}
        .user-info{text-align:right;font-size:0.85rem}
        .user-name{font-weight:600}
        .user-id{color:rgba(255,255,255,0.5);font-size:0.75rem}
        .container{max-width:500px;margin:0 auto;padding:20px}
        .greeting{font-size:1.4rem;margin:20px 0}
        
        .status-card{background:rgba(255,255,255,0.05);border-radius:16px;padding:20px;margin:20px 0}
        .status-title{color:rgba(255,255,255,0.6);font-size:0.85rem;margin-bottom:10px}
        .status-value{font-size:1.1rem;font-weight:500}
        .status-value.success{color:#00ff88}
        .status-value.pending{color:#ffaa00}
        .status-value.closed{color:#ff5252}
        
        .pool-status{display:flex;align-items:center;gap:10px;padding:15px;border-radius:12px;margin:15px 0}
        .pool-status.open{background:rgba(0,255,136,0.1);border:1px solid #00ff88}
        .pool-status.closed{background:rgba(255,170,0,0.1);border:1px solid #ffaa00}
        .pool-status.unavailable{background:rgba(255,82,82,0.1);border:1px solid #ff5252}
        .pool-status-icon{font-size:1.5rem}
        .pool-status-text{font-size:0.9rem}
        
        .menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin:20px 0}
        .menu-item{background:rgba(255,255,255,0.05);border:2px solid transparent;border-radius:16px;padding:25px 15px;text-align:center;text-decoration:none;color:#fff;transition:all 0.3s}
        .menu-item:hover:not(.disabled){border-color:#e94560;transform:translateY(-2px)}
        .menu-item.disabled{opacity:0.4;pointer-events:none}
        .menu-icon{font-size:35px;margin-bottom:10px}
        .menu-label{font-weight:500;font-size:0.9rem}
        .menu-item.admin{background:linear-gradient(135deg,rgba(233,69,96,0.2),rgba(255,107,107,0.1));grid-column:span 2}
        
        .logout{display:block;text-align:center;color:rgba(255,255,255,0.5);text-decoration:none;margin-top:30px;font-size:0.9rem}
        .logout:hover{color:#e94560}
    </style>
</head>
<body>
<div class="header">
    <div class="logo">
        <div class="logo-icon">🍽️</div>
        <span class="logo-text">Food Pool</span>
    </div>
    <div class="user-info">
        <div class="user-name" th:text="${employeeName}">Employee Name</div>
        <div class="user-id" th:text="${employeeId}">EMP001</div>
    </div>
</div>

<div class="container">
    <h2 class="greeting">Hello, <span th:text="${employeeName}">User</span>! 👋</h2>
    
    <!-- Pool Status Banner -->
    <div th:if="${!foodAvailable}" class="pool-status unavailable">
        <span class="pool-status-icon">🚫</span>
        <span class="pool-status-text">No food available today</span>
    </div>
    <div th:if="${foodAvailable && poolOpen}" class="pool-status open">
        <span class="pool-status-icon">✅</span>
        <span class="pool-status-text">Pool is open! Register now</span>
    </div>
    <div th:if="${foodAvailable && !poolOpen}" class="pool-status closed">
        <span class="pool-status-icon">⏳</span>
        <span class="pool-status-text">Survey not started yet</span>
    </div>
    
    <!-- Today's Status -->
    <div class="status-card">
        <div class="status-title">Your Status Today</div>
        <div th:if="${hasPooled}" class="status-value success">
            ✓ Registered for <span th:text="${pooledType}" style="text-transform:uppercase"></span>
            <span th:if="${hasCollected}"> • ✓ Collected</span>
        </div>
        <div th:unless="${hasPooled}" class="status-value pending">
            ⏳ Not registered yet
        </div>
    </div>
    
    <!-- Menu -->
    <div class="menu-grid">
        <a href="/pool" class="menu-item" th:classappend="${!foodAvailable || !poolOpen} ? 'disabled'">
            <div class="menu-icon">📝</div>
            <div class="menu-label">Register for<br>Food Pool</div>
        </a>
        <a href="/scan" class="menu-item" th:classappend="${!hasPooled} ? 'disabled'">
            <div class="menu-icon">📱</div>
            <div class="menu-label">Scan QR<br>to Collect</div>
        </a>
    </div>
    
    <!-- Admin Link -->
    <div th:if="${isAdmin}" class="menu-grid">
        <a href="/admin" class="menu-item admin">
            <div class="menu-icon">⚙️</div>
            <div class="menu-label">Admin Dashboard</div>
        </a>
    </div>
    
    <a href="/logout" class="logout">Sign Out</a>
</div>
</body>
</html>
