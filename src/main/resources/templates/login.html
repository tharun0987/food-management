<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Encipher Food Pool</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root{
            --primary:#0891b2;
            --primary-dark:#0e7490;
            --secondary:#0d9488;
            --accent:#06b6d4;
            --bg-dark:#0c1421;
        }
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Inter',sans-serif;background:linear-gradient(135deg,var(--bg-dark) 0%,#111827 50%,#1f2937 100%);min-height:100vh;display:flex;align-items:center;justify-content:center}
        .container{background:rgba(255,255,255,0.03);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.08);border-radius:20px;padding:48px 40px;text-align:center;max-width:400px;width:90%}
        .logo{width:72px;height:72px;background:linear-gradient(135deg,var(--primary),var(--secondary));border-radius:16px;display:flex;align-items:center;justify-content:center;margin:0 auto 24px;font-size:1.8rem;font-weight:700;color:#fff}
        h1{color:#fff;font-size:1.6rem;font-weight:700;margin-bottom:8px;letter-spacing:-0.5px}
        h1 span{color:var(--accent)}
        .subtitle{color:rgba(255,255,255,0.5);font-size:0.9rem;margin-bottom:32px}
        .company{color:var(--primary);font-weight:500}
        .btn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;padding:16px 24px;background:linear-gradient(135deg,var(--primary),var(--secondary));border:none;border-radius:10px;color:#fff;font-size:1rem;font-weight:600;cursor:pointer;transition:all 0.2s;text-decoration:none}
        .btn:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(8,145,178,0.3)}
        .features{margin-top:36px;display:flex;justify-content:center;gap:24px}
        .feature{text-align:center}
        .feature-icon{width:40px;height:40px;margin:0 auto 8px;background:rgba(255,255,255,0.05);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:0.9rem;font-weight:700;color:var(--accent)}
        .feature-text{color:rgba(255,255,255,0.4);font-size:0.7rem;line-height:1.4}
    </style>
</head>
<body>
<div class="container">
    <div class="logo">EF</div>
    <h1>Encipher<span>Food</span></h1>
    <p class="subtitle">Employee Food Management<br><span class="company">Encipher Health</span></p>
    
    <a href="/oauth2/authorization/zoho" class="btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/>
        </svg>
        Sign in with Zoho
    </a>
    
    <div class="features">
        <div class="feature">
            <div class="feature-icon">V</div>
            <div class="feature-text">Vote for<br>Meals</div>
        </div>
        <div class="feature">
            <div class="feature-icon">S</div>
            <div class="feature-text">Scan to<br>Collect</div>
        </div>
        <div class="feature">
            <div class="feature-icon">T</div>
            <div class="feature-text">Track<br>History</div>
        </div>
    </div>
</div>
</body>
</html>
